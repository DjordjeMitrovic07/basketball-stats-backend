spring.application.name=backend

# Database (bez tajni)
spring.datasource.url=jdbc:mysql://localhost:3306/bballstats
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Umesto pravih vrednosti, koristi env/override iz local fajla
spring.datasource.username=${DB_USER:changeme}
spring.datasource.password=${DB_PASS:changeme}

# JWT ? secret ide iz local fajla ili env promenljive
app.jwt.secret=${JWT_SECRET:change-me-in-local}
app.jwt.expiration-ms=2592000000

# CORS (nije tajna, mo?e ostati ovde)
app.cors.allowed-origin=http://localhost:4200

# Server
server.port=8080
